<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국내 학회 진료지침 모음</title>
<meta name="description" content="대한의학회 회원학회 게시판의 공개 진료지침을 자동으로 모아 날짜·분과별로 보여줍니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="alternate" type="application/rss+xml" title="신규 진료지침" href="feed.xml">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1>국내 학회 진료지침 모음</h1>
      <p class="sub" id="sub">불러오는 중…</p>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="list" aria-selected="true">진료지침</button>
      <button role="tab" data-tab="status" aria-selected="false">수집 현황</button>
      <a class="rss" href="feed.xml" title="새 진료지침 RSS">RSS</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-list">
    <div class="controls">
      <div class="row">
        <input id="q" type="search" placeholder="제목·학회 검색 (예: 간경변, 심부전, 2025)" autocomplete="off">
        <select id="society" aria-label="학회"><option value="">전체 학회</option></select>
        <select id="period" aria-label="기간">
          <option value="">전체 기간</option>
          <option value="1">최근 1년</option>
          <option value="3">최근 3년</option>
          <option value="5">최근 5년</option>
        </select>
      </div>
      <div class="row seg-row">
        <div class="seg" id="groups" aria-label="계열"></div>
        <div class="seg" id="views" aria-label="보기">
          <button data-view="timeline" class="on">날짜별</button>
          <button data-view="division">분과별</button>
          <button data-view="society">학회별</button>
        </div>
      </div>
      <div class="chips" id="divisions" aria-label="분과"></div>
      <div class="row small">
        <label><input type="checkbox" id="newOnly"> 최근 6개월 이내</label>
        <label><input type="checkbox" id="koOnly"> 국문 제목만</label>
        <label>정렬
          <select id="sort">
            <option value="date">발행일순</option>
            <option value="seen">수집일순</option>
          </select>
        </label>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div id="results"></div>
  </section>

  <section id="tab-status" hidden>
    <p class="note">학회별 마지막 수집 결과입니다. <b>확인 필요</b> 표시는 게시판 주소를 찾지 못했거나 목록을 읽지 못한 경우로,
      <code>config/societies.yaml</code>에 게시판 주소를 적거나 맞춤 파서를 추가하면 해결됩니다.</p>
    <div id="status"></div>
  </section>
</main>

<footer class="wrap foot">
  <p>각 학회 게시판의 <b>공개</b> 게시물 제목·링크만 모아 둔 색인입니다. 원문 저작권은 각 학회에 있으며, 내용은 반드시 원문으로 확인하세요.
    회원 전용 게시물은 수집하지 않습니다.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
