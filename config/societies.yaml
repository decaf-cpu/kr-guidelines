# 수집 대상 학회 목록
#
# 각 항목 설명
#   id         : 영문 고유 ID (파일명·URL에 쓰임, 바꾸지 말 것)
#   name       : 학회 정식 명칭
#   short      : 화면에 표시할 짧은 이름
#   homepage   : 학회 홈페이지 (게시판 자동 탐색의 출발점)
#   group      : 계열 (내과계 / 외과계 / 지원계 / 기타) - config/taxonomy.yaml 참고
#   specialty  : 전문과
#   division   : 분과
#   boards     : 진료지침 게시판 목록. 비워 두면 홈페이지 메뉴에서 자동 탐색
#     - url        : 게시판 목록 첫 페이지 주소
#       name       : 게시판 이름 (선택)
#       dedicated  : true면 진료지침 전용 게시판 → 제목 키워드 필터를 느슨하게 적용
#       (아래는 범용 파서가 못 읽을 때만 지정)
#       row_selector      : 게시물 한 줄을 가리키는 CSS 선택자 (예: "table.board tbody tr")
#       title_selector    : 행 안에서 제목 링크 CSS 선택자
#       date_selector     : 행 안에서 날짜 CSS 선택자
#       page_param        : 페이지 번호 쿼리 이름 (자동 감지 실패 시)
#       js_link_template  : 제목 링크가 javascript:view(123) 형태일 때 실제 주소 틀
#                           (예: "/bbs/view.php?idx={0}")
#       drop_params       : 글 주소에서 지울 쿼리 이름 (분류 필터 게시판에서 같은 글이 두 번 잡히지 않게, 예: [category])
#       label_year        : true면 행의 분류 표시(예: 'COVID-19 진료지침 2024')에 붙은 연도를 학회가 정한 발행연도로 사용
#   verify_ssl : 인증서 오류가 있는 사이트는 false (기본 true; 오류 시 자동 재시도도 함)
#   enabled    : false면 자동 수집 제외
#   manual     : true면 config/manual.yaml에 손으로 등록한 지침을 사이트에 표시
#                (robots.txt·방화벽 등으로 자동 수집이 막힌 학회용)
#   note       : 메모
#
# 대한의학회 회원학회 여부는 KAMS 회원학회 목록과 대조해 두는 것을 권장합니다.

