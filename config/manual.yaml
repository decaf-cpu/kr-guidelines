# 수동 등록 진료지침
#
# robots.txt나 웹 방화벽 때문에 자동 수집이 막힌 학회의 공개 진료지침을 여기에 적으면
# 사이트에 함께 표시됩니다 (학회 배지에 ✎ 표시). GitHub 웹에서 이 파일을 바로 고쳐도 됩니다.
#
# 대상 학회 (config/societies.yaml에서 manual: true)
#   kges  대한소화기내시경학회      kcr   대한류마티스학회
#   ksso  대한비만학회              ksat  대한항균요법학회
#   kscvi 대한심혈관중재학회         kspid 대한소아감염학회
#   kses  대한자궁내막증학회
#
# 항목 형식
#   - society: kcr                       # 학회 id (필수)
#     title: 2025 류마티스관절염 진료지침     # 지침 이름 (필수)
#     url: https://...                    # 지침 게시물 또는 파일 주소 (필수)
#     date: 2025                          # 발행 시점: 2025 / 2025-10 / 2025-10-04 (선택)
#     added: 2026-11-15                   # 등록한 날 — NEW 표시와 RSS에 쓰임 (선택)
#     files:                              # 첨부 파일 (선택)
#       - https://.../guideline.pdf
#
# 공개 자료만 적어 주세요. 회원 전용 자료는 등록하지 않습니다.

